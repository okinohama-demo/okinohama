<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172023">
  <title>おきのはま製パン｜扉をひらく</title>
  <meta name="description" content="取っ手を引いて、焼きたてのパンに会いに。架空のパン屋「おきのはま製パン」の制作見本。">
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/open/loaf.jpg" as="image">
  <link rel="stylesheet" href="door.css">
</head>
<body>
  <main class="oven" id="oven" data-position="closed">
    <section class="chamber" aria-labelledby="bread-title">
      <div class="chamber-wall wall-left" aria-hidden="true"></div>
      <div class="chamber-wall wall-right" aria-hidden="true"></div>
      <img class="bread" src="assets/open/loaf.jpg" alt="オーブンの奥にある、焼きたての山型食パン" width="720" height="1280" fetchpriority="high" draggable="false">
      <div class="chamber-vignette" aria-hidden="true"></div>
      <div class="bread-info" id="bread-info" aria-hidden="true">
        <p>徳島市沖浜町、朝7時。</p>
        <h1 id="bread-title">おきのはま製パン</h1>
        <p class="bread-name">沖浜の朝・山型食パン</p>
        <small>架空の店の制作見本です</small>
      </div>
    </section>
    <div class="perspective" id="perspective">
      <div class="door-leaf" id="door-leaf">
        <div class="door-back door-cutout" aria-hidden="true"></div>
        <div class="door-skin door-cutout" aria-hidden="true"></div>
        <div class="door-edge" aria-hidden="true"></div>
        <div class="glass" aria-hidden="true"><div class="glass-reflection"></div></div>
        <div class="door-shade door-cutout" aria-hidden="true"></div>
        <div class="makers-plate"><span>おきのはま製パン</span><small>沖浜町・一九九九年から</small></div>
        <svg class="thermometer" viewBox="0 0 100 100" aria-hidden="true">
          <defs><radialGradient id="dial"><stop stop-color="#d8d8cb"/><stop offset=".83" stop-color="#b5b9ac"/><stop offset="1" stop-color="#64716e"/></radialGradient></defs>
          <circle cx="50" cy="50" r="49" fill="#101719" stroke="#737e79" stroke-width="2"/>
          <circle cx="50" cy="50" r="43" fill="url(#dial)"/>
          <g id="ticks" stroke="#34413d"></g>
          <g font-family="serif" font-size="10" fill="#34413d" text-anchor="middle"><text x="24" y="75">0</text><text x="23" y="37">100</text><text x="65" y="26">200</text><text x="79" y="64">300</text></g>
          <path d="M45 57 69 27" stroke="#333b37" stroke-width="2"/><circle cx="50" cy="50" r="4" fill="#333b37"/>
          <text x="50" y="87" font-family="serif" font-size="7" fill="#34413d" text-anchor="middle">°C</text>
        </svg>
        <div class="rivets" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="handle" id="handle" role="slider" tabindex="0" aria-label="オーブンの扉" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="閉じています" aria-orientation="vertical" aria-describedby="gesture-help">
          <img src="assets/open/handle.webp" alt="" width="672" height="98" draggable="false">
        </div>
        <p class="door-instruction" id="gesture-help">取っ手を下に引いて、開ける</p>
        <span class="hinge hinge-left" aria-hidden="true"></span><span class="hinge hinge-right" aria-hidden="true"></span>
      </div>
    </div>
    <div class="fixed-controls"><span class="demo-label">制作見本</span><button class="toggle-door" id="toggle-door" type="button" aria-controls="door-leaf">タップで開ける</button></div>
    <div class="motion-note" id="motion-note" hidden><span id="motion-message">動きを減らす設定になっています。</span><button type="button" id="motion-toggle">扉の動きを試す</button></div>
    <p class="sr-only" id="door-status" role="status" aria-live="polite"></p>
    <noscript><p class="no-script">扉を動かすにはJavaScriptを有効にしてください。</p></noscript>
  </main>
  <script type="module" src="door.js"></script>
</body>
</html>
